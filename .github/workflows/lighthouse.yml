name: Lighthouse CI

# Phase 2: measure the deployed Vercel preview instead of a localhost
# build on the runner. The deployment_status event fires once Vercel
# finishes a preview, which is closer to what real users hit (CDN,
# Brotli, image optimization, fra1 region) and avoids the 20-40%
# pessimism we observed in Phase 1. workflow_dispatch is preserved for
# manual runs; if no target_url is provided it falls back to building
# and serving locally, mirroring the pre-Phase-2 behaviour.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL to audit (leave empty to build + serve localhost)'
        required: false
        default: ''

concurrency:
  group: lighthouse-${{ github.event.deployment_status.target_url || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  lighthouse:
    name: Lighthouse Audit
    # Skip Production deployments (we audit Preview only) and any
    # non-success deployment states. Manual dispatch always runs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment != 'Production' &&
       startsWith(github.event.deployment_status.target_url, 'https://'))
    runs-on: ubuntu-latest
    # Phase 2 measures a remote Vercel preview, so each audit adds a
    # network roundtrip vs the old localhost flow. 6 URLs × 3 runs lands
    # around 14 minutes in good conditions; 15 left zero margin and
    # killed the job mid-/ar/custom-order on PR #376. Doubling to 30
    # gives headroom for Vercel cold starts and edge cache warmups
    # without masking real regressions.
    timeout-minutes: 30
    env:
      LHCI_TARGET_URL: ${{ github.event.deployment_status.target_url || inputs.target_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # For deployment_status, check out the exact commit Vercel deployed
          # so lighthouserc.js (and any future per-route budgets) match the
          # code being measured. The webhook payload puts the SHA on the
          # sibling `deployment` object, not nested under `deployment_status`.
          ref: ${{ github.event.deployment.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js (only when no remote target_url)
        if: env.LHCI_TARGET_URL == ''
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # Preflight: the provider-detail URL in lighthouserc.js is pinned to a
      # specific provider id. If that provider gets deactivated, the Lighthouse
      # run would silently audit a 404 page or unrelated redirect target and
      # the assertion results would be garbage. Fail fast here with a clear
      # message and the actual status code so the failure mode is obvious.
      # Only runs on remote target_url — local builds without a target are
      # used for ad-hoc dev runs that may not have a populated db.
      #
      # Note: redirects are treated as failure. -L is intentionally omitted
      # so a 3xx response surfaces as STATUS rather than being followed to
      # whatever fallback page Vercel/Next decided on (e.g. a deactivated
      # provider redirecting to /providers list would otherwise yield a 200
      # and silently pass the check). Active providers respond 200 directly.
      - name: Preflight — verify pinned provider URL is reachable
        if: env.LHCI_TARGET_URL != ''
        run: |
          set -euo pipefail
          PROVIDER_ID=$(node -e "console.log(require('./lighthouserc.js').HARDCODED_PROVIDER_ID)")
          URL="${LHCI_TARGET_URL%/}/ar/providers/${PROVIDER_ID}"
          echo "Checking $URL"
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "$URL")
          echo "HTTP $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "::error::Pinned provider URL returned HTTP $STATUS — provider may be deactivated, deleted, or the route may have changed."
            echo "::error::A 3xx redirect counts as failure here because an active provider serves 200 directly. If this is a legitimate routing change, update the lighthouse workflow preflight too."
            echo "::error::To fix: pick another active provider id and update HARDCODED_PROVIDER_ID in lighthouserc.js."
            exit 1
          fi

      - name: Run Lighthouse CI
        run: npx @lhci/cli@0.15.x autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-results
          path: .lighthouseci/
          # actions/upload-artifact@v4 skips dot-prefixed paths by default,
          # so without this flag the .lighthouseci/ directory uploads as an
          # empty artifact and Phase 1 never gets a numeric breakdown.
          include-hidden-files: true
          retention-days: 14
